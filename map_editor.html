<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Kirby Level Editor</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#e0e0e0; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; user-select:none; }
.header { background:#16213e; padding:6px 12px; display:flex; align-items:center; gap:12px; flex-shrink:0; border-bottom:1px solid #0f3460; }
.header h1 { font-size:16px; color:#e94560; white-space:nowrap; }
.palette { display:flex; flex-wrap:wrap; gap:3px; align-items:center; }
.palette-btn { width:30px; height:30px; border:2px solid #333; border-radius:3px; cursor:pointer; position:relative; font-size:8px; color:#fff; text-shadow:0 0 2px #000; display:flex; align-items:center; justify-content:center; transition:all 0.1s; }
.palette-btn:hover { transform:scale(1.15); border-color:#e94560; z-index:2; }
.palette-btn.active { border-color:#e94560; box-shadow:0 0 8px #e94560; transform:scale(1.1); }
.palette-btn .label { position:absolute; bottom:-14px; font-size:8px; color:#aaa; white-space:nowrap; pointer-events:none; }
.palette-sep { width:1px; height:24px; background:#333; margin:0 4px; }
.toolbar { background:#16213e; padding:4px 12px; display:flex; align-items:center; gap:10px; flex-shrink:0; border-bottom:1px solid #0f3460; font-size:12px; }
.toolbar button { background:#0f3460; color:#e0e0e0; border:1px solid #333; padding:4px 10px; border-radius:3px; cursor:pointer; font-size:11px; }
.toolbar button:hover { background:#1a4a8a; }
.toolbar input[type=number] { width:60px; background:#0f3460; color:#e0e0e0; border:1px solid #333; padding:3px 6px; border-radius:3px; font-size:11px; }
.toolbar select { background:#0f3460; color:#e0e0e0; border:1px solid #333; padding:3px 6px; border-radius:3px; font-size:11px; }
.zone-bar { display:flex; flex-shrink:0; height:22px; background:#0a0a1a; border-bottom:1px solid #0f3460; position:relative; }
.zone-label { display:flex; align-items:center; justify-content:center; font-size:9px; color:#ccc; border-right:1px dashed #333; overflow:hidden; white-space:nowrap; position:absolute; top:0; height:100%; }
.viewport { flex:1; overflow:auto; background:#111; position:relative; }
.viewport canvas { display:block; }
.minimap-container { flex-shrink:0; height:52px; background:#0a0a1a; border-top:1px solid #0f3460; position:relative; overflow:hidden; cursor:pointer; }
.minimap-container canvas { display:block; height:100%; }
.minimap-indicator { position:absolute; top:0; height:100%; border:1px solid #e94560; background:rgba(233,69,96,0.15); pointer-events:none; }
.statusbar { background:#16213e; padding:3px 12px; display:flex; align-items:center; gap:16px; flex-shrink:0; font-size:11px; border-top:1px solid #0f3460; }
.statusbar .stat { color:#aaa; }
.statusbar .stat b { color:#e94560; }
.toast { position:fixed; top:50px; left:50%; transform:translateX(-50%); background:#0f3460; color:#e0e0e0; padding:10px 20px; border-radius:6px; z-index:9999; font-size:13px; animation:fadeOut 2s forwards; pointer-events:none; }
@keyframes fadeOut { 0%,70% { opacity:1; } 100% { opacity:0; } }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:999; align-items:center; justify-content:center; }
.modal.show { display:flex; }
.modal-box { background:#16213e; border:1px solid #0f3460; border-radius:8px; padding:16px; max-width:90vw; max-height:85vh; overflow:auto; }
.modal-box h3 { color:#e94560; margin-bottom:10px; }
.modal-box textarea { width:100%; min-width:700px; height:300px; background:#0a0a1a; color:#e0e0e0; border:1px solid #333; padding:8px; font-family:Consolas,monospace; font-size:11px; resize:vertical; }
.modal-box button { background:#e94560; color:#fff; border:none; padding:6px 16px; border-radius:4px; cursor:pointer; margin:6px 4px 0 0; }
.modal-box button:hover { background:#ff6b81; }
</style>
</head>
<body>

<div class="header">
  <h1>Kirby Level Editor</h1>
  <div class="palette" id="palette"></div>
</div>

<div class="toolbar">
  <button onclick="zoomOut()" title="缩小">−</button>
  <span id="zoomLabel" style="min-width:38px;text-align:center;">14px</span>
  <button onclick="zoomIn()" title="放大">+</button>
  <span style="color:#555;">|</span>
  <span>跳转列:</span>
  <input type="number" id="gotoCol" min="0" max="599" value="0" onchange="gotoColumn()" onkeydown="if(event.key==='Enter')gotoColumn()">
  <button onclick="gotoColumn()">跳转</button>
  <span style="color:#555;">|</span>
  <select id="zoneJump" onchange="jumpToZone()">
    <option value="">跳转到区域...</option>
    <option value="0">A新手平原 (0-80)</option>
    <option value="81">B水道区 (81-170)</option>
    <option value="171">C攀升区 (171-260)</option>
    <option value="261">D尖刺区 (261-350)</option>
    <option value="351">E冰封区 (351-440)</option>
    <option value="441">F混合战 (441-530)</option>
    <option value="531">G终章 (531-600)</option>
  </select>
  <span style="color:#555;">|</span>
  <button onclick="undo()" title="撤销 Ctrl+Z">↩ 撤销</button>
  <button onclick="redo()" title="重做 Ctrl+Y">↪ 重做</button>
</div>

<div class="zone-bar" id="zoneBar"></div>

<div class="viewport" id="viewport">
  <canvas id="grid"></canvas>
</div>

<div class="minimap-container" id="minimapContainer">
  <canvas id="minimap"></canvas>
  <div class="minimap-indicator" id="minimapIndicator"></div>
</div>

<div class="statusbar">
  <span class="stat" id="coordInfo">坐标: —</span>
  <span class="stat" id="tileInfo">当前: 空气(.)</span>
  <span style="flex:1;"></span>
  <button onclick="showExport()" style="background:#0f3460;color:#e0e0e0;border:1px solid #333;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;">导出 C++ 代码</button>
  <button onclick="showImport()" style="background:#0f3460;color:#e0e0e0;border:1px solid #333;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;">导入 C++ 代码</button>
  <button onclick="clearMap()" style="background:#5a1a1a;color:#e0e0e0;border:1px solid #733;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;">清空重来</button>
</div>

<div class="modal" id="exportModal">
  <div class="modal-box">
    <h3>导出 C++ 代码 — 复制以下内容替换 loadLevel() 中的 levelData</h3>
    <textarea id="exportText" readonly></textarea>
    <button onclick="copyExport()">复制到剪贴板</button>
    <button onclick="closeModal('exportModal')">关闭</button>
  </div>
</div>

<div class="modal" id="importModal">
  <div class="modal-box">
    <h3>导入 — 粘贴现有的 levelData = { ... }; 代码块</h3>
    <textarea id="importText" placeholder="粘贴 C++ 代码，包含 levelData = { &quot;...&quot;, ... }; 部分..."></textarea>
    <button onclick="doImport()">导入</button>
    <button onclick="closeModal('importModal')">取消</button>
  </div>
</div>

<script>
// ============================================================
// 地图数据
// ============================================================
const ROWS = 13, COLS = 600;
let mapData = []; // 字符串数组，每行600字符
// 初始化默认模板
function initDefaultMap() {
  mapData = [
    "........................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................",
    "........................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................",
    "........................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................",
    ".............................................................................................................................................................................................................G..C.......................................................................................................................................................................................................................................................................................................................................................................................................",
    "......................................................................C...................................C......C.................................................................................C.....1111111111..........................................................................................................................................................................7.C7..7..7................C..........................................................L....................C................................................................................................................",
    "....................................................................1111.................................111....111.............I..................................................................C1....17777777711111111111.........................................................................................C........................................................................55..55.................111.....................................G.................1111..................1111...F.CL..G....................................................................................................",
    "...............................................................1111.2222.............1111................222.111222............1111..............................................................111111............1111111111............................................................................C.....11.11.11.11.11..................................................................55..55.............111.222..................................111111...............2222..............7.I.7272..11.11.11................................................C...................................................",
    ".........................................1111..................2222..................2222.............111....222...............2222................................................11..........1111111111............111111.......11C11..............................................................11.11.11..22.22.22.22.22..................................................................55..55.............222......................................222222................G................1111......22.22.22..............................................C1111111111111111111..................................",
    ".........................................2222.........................................................222.........................................................................1111111111C111777777771...........77777777.1111111111.............................................7...7.7...7.7...727727727...............7...7.7...7.7.7.........................................55.55.55...55..55......................8.8.8.8.8...........................................111111.............72727.7........................................................111111171717171717171..................................",
    ".....................................................................................333333..........33333333.................333333.....77777777...........33333................11111777F77771..............................177777777.11111F1111...................................................7777777777...................................................7.7.7.....333333..35535535537.7.7.7.7..7777L777.3333333333..................................F......777I7777...2F2222...7777G777.3333333333...........77F77E77................................717171711................11111111.........................",
    "..........C.......C.............7.7.7.7.7.....7777777C....7..7..................P....444444.7.7.K...I44444444.......5757575755444444....5555155555....C...C.444411........P11117777771111111111........................................1777777771..7.676676.........P77.77.77.77.77.7...7.7...7.7............77777777777777777.77.77.77.777.7.7.7.7.....E..C..P555111555577444I44774444444444..............1.....44444444447777777777...I..C............P..7.7.7.7.....1.......7777777766661666664444444444..............1........C..C............P.C..C..C..1111111111...............1111111111..C...C........CCC.T....",
    "11111111111111111111111..11...11...111...1..1....1...111..111..11111111....11...1.11.111111..1..1111111111111111111155555555551111111111555555555511111111111155555511111111111111111............................................................1111666666..11111.....1..1.11..1..1.......1.......................................1...........11.......111...155555555555555555555111111111111111111115555555555111111111155551555551111111111..11111.......11....5555555555....11....66666666661111111111111111111155555666661111111111..11111.....11111............................1111111111..111111....111111..1111",
    "222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222",
  ];
}

initDefaultMap();

// 撤销系统
let undoStack = [], redoStack = [];
const MAX_UNDO = 50;
function saveUndo() {
  undoStack.push([...mapData]);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (undoStack.length === 0) { toast('没有可撤销的操作'); return; }
  redoStack.push([...mapData]);
  mapData = [...undoStack.pop()];
  renderAll();
}
function redo() {
  if (redoStack.length === 0) { toast('没有可恢复的操作'); return; }
  undoStack.push([...mapData]);
  mapData = [...redoStack.pop()];
  renderAll();
}

// ============================================================
// 调色板定义
// ============================================================
const paletteItems = [
  { ch:'.', name:'空气', color:'#87CEEB', border:'#6baed6' },
  { ch:'1', name:'草地', color:'#4CAF50', border:'#388E3C' },
  { ch:'2', name:'泥土', color:'#8B4513', border:'#6B3410' },
  { ch:'3', name:'水面', color:'#42A5F5', border:'#1E88E5' },
  { ch:'4', name:'水体', color:'#1565C0', border:'#0D47A1' },
  { ch:'5', name:'冰砖', color:'#B3E5FC', border:'#81D4FA' },
  { ch:'6', name:'碎石', color:'#9E9E9E', border:'#757575' },
  { ch:'7', name:'尖刺A', color:'#FF1744', border:'#D50000' },
  { ch:'8', name:'尖刺B', color:'#FF5252', border:'#D32F2F' },
  { ch:'9', name:'尖刺C', color:'#FF8A80', border:'#FF5252' },
  { ch:'A', name:'墙刺', color:'#D50000', border:'#B71C1C' },
  { ch:'B', name:'大刺', color:'#B71C1C', border:'#7F0000' },
  { ch:'C', name:'蛋糕', color:'#FF69B4', border:'#E91E63' },
  { ch:'K', name:'木箱', color:'#D2691E', border:'#A0522D' },
  { ch:'P', name:'存档点', color:'#FFD700', border:'#FFA000' },
  { ch:'T', name:'终点旗', color:'#FFD700', border:'#FFA000' },
  { ch:'E', name:'普通敌', color:'#FF9800', border:'#F57C00' },
  { ch:'F', name:'火敌', color:'#F44336', border:'#D32F2F' },
  { ch:'I', name:'冰敌', color:'#00BCD4', border:'#0097A7' },
  { ch:'G', name:'叶敌', color:'#8BC34A', border:'#689F38' },
  { ch:'L', name:'电敌', color:'#FFEB3B', border:'#FBC02D' },
];
let currentTile = '.';

// ============================================================
// 渲染参数
// ============================================================
let cellSize = 14;
const MIN_ZOOM = 8, MAX_ZOOM = 28;

// DOM元素
const gridCanvas = document.getElementById('grid');
const gridCtx = gridCanvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
const viewport = document.getElementById('viewport');
const minimapContainer = document.getElementById('minimapContainer');
const minimapIndicator = document.getElementById('minimapIndicator');

// ============================================================
// 构建调色板UI
// ============================================================
const paletteEl = document.getElementById('palette');
paletteItems.forEach((item, idx) => {
  const btn = document.createElement('div');
  btn.className = 'palette-btn' + (item.ch === currentTile ? ' active' : '');
  btn.style.background = item.color;
  btn.style.borderColor = item.border;
  btn.title = `${item.name} (${item.ch})`;
  btn.innerHTML = `<span style="font-weight:bold;font-size:${item.ch.length>1?7:11}px;">${item.ch}</span><span class="label">${item.name}</span>`;
  btn.onclick = () => selectTile(item.ch);
  btn.id = 'pal-' + item.ch;
  paletteEl.appendChild(btn);
});

function selectTile(ch) {
  currentTile = ch;
  document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('pal-' + ch);
  if (btn) btn.classList.add('active');
  document.getElementById('tileInfo').innerHTML = `当前: ${paletteItems.find(p=>p.ch===ch)?.name||ch} (${ch})`;
}

// ============================================================
// 构建区域标签栏
// ============================================================
const zones = [
  { name:'A 新手平原', start:0, end:80, color:'#4CAF50' },
  { name:'B 水道区', start:81, end:170, color:'#42A5F5' },
  { name:'C 攀升区', start:171, end:260, color:'#FF9800' },
  { name:'D 尖刺挑战', start:261, end:350, color:'#F44336' },
  { name:'E 冰封区', start:351, end:440, color:'#B3E5FC' },
  { name:'F 混合战', start:441, end:530, color:'#AB47BC' },
  { name:'G 终章冲刺', start:531, end:600, color:'#FFD700' },
];
const zoneBar = document.getElementById('zoneBar');
zones.forEach(z => {
  const el = document.createElement('div');
  el.className = 'zone-label';
  el.style.left = (z.start / COLS * 100) + '%';
  el.style.width = ((z.end - z.start) / COLS * 100) + '%';
  el.style.background = z.color + '22';
  el.style.borderLeft = '2px solid ' + z.color;
  el.textContent = z.name + ` (${z.start}-${z.end})`;
  zoneBar.appendChild(el);
});

function jumpToZone() {
  const val = document.getElementById('zoneJump').value;
  if (val !== '') gotoColumn(parseInt(val));
  document.getElementById('zoneJump').value = '';
}

// ============================================================
// Canvas渲染
// ============================================================
function updateCanvasSize() {
  gridCanvas.width = COLS * cellSize;
  gridCanvas.height = ROWS * cellSize;
}

function drawCell(r, c, ch) {
  const item = paletteItems.find(p => p.ch === ch);
  const color = item ? item.color : (ch === '.' ? '#87CEEB' : '#eee');
  const x = c * cellSize, y = r * cellSize;
  gridCtx.fillStyle = color;
  gridCtx.fillRect(x, y, cellSize, cellSize);
  // 网格线
  if (cellSize >= 10) {
    gridCtx.strokeStyle = 'rgba(0,0,0,0.08)';
    gridCtx.lineWidth = 0.5;
    gridCtx.strokeRect(x, y, cellSize, cellSize);
  }
  // 小字符标签
  if (cellSize >= 14 && ch !== '.') {
    gridCtx.fillStyle = '#000';
    gridCtx.font = `${Math.max(7, cellSize*0.55)}px sans-serif`;
    gridCtx.textAlign = 'center';
    gridCtx.textBaseline = 'middle';
    gridCtx.fillText(ch, x + cellSize/2, y + cellSize/2);
  }
}

function renderAll() {
  updateCanvasSize();
  gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      drawCell(r, c, mapData[r][c]);
    }
  }
  // 高亮行11和行12
  gridCtx.fillStyle = 'rgba(255,255,255,0.04)';
  gridCtx.fillRect(0, 11 * cellSize, COLS * cellSize, 2 * cellSize);
  updateMinimap();
}

function renderCell(r, c) {
  drawCell(r, c, mapData[r][c]);
}

function renderRow(r) {
  for (let c = 0; c < COLS; c++) drawCell(r, c, mapData[r][c]);
}

// ============================================================
// 迷你地图
// ============================================================
function updateMinimap() {
  const w = minimapContainer.clientWidth;
  const h = minimapContainer.clientHeight;
  minimapCanvas.width = w;
  minimapCanvas.height = h;
  const scaleX = w / COLS;
  const scaleY = h / ROWS;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const item = paletteItems.find(p => p.ch === mapData[r][c]);
      minimapCtx.fillStyle = item ? item.color : (mapData[r][c] === '.' ? '#87CEEB' : '#eee');
      minimapCtx.fillRect(c * scaleX, r * scaleY, Math.ceil(scaleX), Math.ceil(scaleY));
    }
  }
}

function updateMinimapIndicator() {
  const vpW = viewport.clientWidth;
  const vpH = viewport.clientHeight;
  const totalW = COLS * cellSize;
  const totalH = ROWS * cellSize;
  const scrollLeft = viewport.scrollLeft;
  const scrollTop = viewport.scrollTop;
  const mmW = minimapContainer.clientWidth;
  const mmH = minimapContainer.clientHeight;
  const scaleX = mmW / totalW;
  const scaleY = mmH / totalH;
  const left = scrollLeft * scaleX;
  const top = scrollTop * scaleY;
  const width = vpW * scaleX;
  const height = vpH * scaleY;
  minimapIndicator.style.left = left + 'px';
  minimapIndicator.style.top = top + 'px';
  minimapIndicator.style.width = width + 'px';
  minimapIndicator.style.height = height + 'px';
}

// ============================================================
// 鼠标交互
// ============================================================
let isPainting = false;
let lastPaintedCell = null;

function canvasPos(e) {
  const rect = gridCanvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left + viewport.scrollLeft,
    y: e.clientY - rect.top + viewport.scrollTop
  };
}

function cellFromPos(pos) {
  const r = Math.floor(pos.y / cellSize);
  const c = Math.floor(pos.x / cellSize);
  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return {r, c};
  return null;
}

gridCanvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) { // 右键擦除
    e.preventDefault();
    const cell = cellFromPos(canvasPos(e));
    if (cell) {
      saveUndo();
      mapData[cell.r] = mapData[cell.r].substring(0, cell.c) + '.' + mapData[cell.r].substring(cell.c + 1);
      renderAll();
      updateStats(cell.r, cell.c);
    }
    return;
  }
  if (e.button !== 0) return;
  isPainting = true;
  const cell = cellFromPos(canvasPos(e));
  if (cell) {
    saveUndo();
    paintCell(cell.r, cell.c);
  }
});

gridCanvas.addEventListener('mousemove', (e) => {
  const cell = cellFromPos(canvasPos(e));
  if (cell) {
    updateStats(cell.r, cell.c);
    // 高亮效果：重绘当前行（简单实现）
    if (isPainting) {
      const key = cell.r + ',' + cell.c;
      if (key !== lastPaintedCell) {
        lastPaintedCell = key;
        paintCell(cell.r, cell.c);
      }
    }
  }
  // 更新小地图指示器
  updateMinimapIndicator();
});

window.addEventListener('mouseup', () => {
  if (isPainting) {
    isPainting = false;
    lastPaintedCell = null;
    updateMinimap();
  }
});

gridCanvas.addEventListener('contextmenu', e => e.preventDefault());

function paintCell(r, c) {
  const old = mapData[r];
  mapData[r] = old.substring(0, c) + currentTile + old.substring(c + 1);
  renderCell(r, c);
}

// ============================================================
// 小地图点击导航
// ============================================================
minimapContainer.addEventListener('click', (e) => {
  const rect = minimapContainer.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const mmW = minimapContainer.clientWidth;
  const totalW = COLS * cellSize;
  const targetScrollLeft = (x / mmW) * totalW - viewport.clientWidth / 2;
  viewport.scrollLeft = Math.max(0, Math.min(targetScrollLeft, totalW - viewport.clientWidth));
  updateMinimapIndicator();
});

// ============================================================
// 键盘快捷键
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); return; }
  // 数字键选择调色板
  const idx = parseInt(e.key) - 1;
  if (idx >= 0 && idx < Math.min(9, paletteItems.length)) {
    selectTile(paletteItems[idx].ch);
  }
});

// ============================================================
// 缩放
// ============================================================
function zoomIn() {
  if (cellSize < MAX_ZOOM) {
    cellSize += 2;
    applyZoom();
  }
}
function zoomOut() {
  if (cellSize > MIN_ZOOM) {
    cellSize -= 2;
    applyZoom();
  }
}
function applyZoom() {
  document.getElementById('zoomLabel').textContent = cellSize + 'px';
  renderAll();
  viewport.scrollLeft = Math.max(0, viewport.scrollLeft);
  updateMinimapIndicator();
}

// ============================================================
// 跳转
// ============================================================
function gotoColumn(c) {
  if (c === undefined) c = parseInt(document.getElementById('gotoCol').value) || 0;
  c = Math.max(0, Math.min(c, COLS - 1));
  document.getElementById('gotoCol').value = c;
  const scrollLeft = c * cellSize - viewport.clientWidth / 2;
  viewport.scrollLeft = Math.max(0, scrollLeft);
  updateMinimapIndicator();
}

// ============================================================
// 坐标与统计
// ============================================================
function updateStats(r, c) {
  const ch = mapData[r][c];
  const item = paletteItems.find(p => p.ch === ch);
  document.getElementById('coordInfo').innerHTML = `坐标: 行${r} 列${c} | ${item ? item.name : '空气'} (${ch})`;
}

function getStats() {
  const counts = {};
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const ch = mapData[r][c];
      counts[ch] = (counts[ch] || 0) + 1;
    }
  return counts;
}

// ============================================================
// 导出
// ============================================================
function showExport() {
  const lines = mapData.map(s => '            "' + s + '",');
  const code = '        levelData = {\n' + lines.join('\n') + '\n        };';
  document.getElementById('exportText').value = code;
  document.getElementById('exportModal').classList.add('show');
}

function copyExport() {
  const ta = document.getElementById('exportText');
  ta.select();
  document.execCommand('copy');
  toast('已复制到剪贴板! 粘贴到 mainwindow.cpp 的 loadLevel() 中替换 levelData');
  closeModal('exportModal');
}

// ============================================================
// 导入
// ============================================================
function showImport() {
  document.getElementById('importText').value = '';
  document.getElementById('importModal').classList.add('show');
}

function doImport() {
  const raw = document.getElementById('importText').value;
  // 提取所有双引号包裹的字符串
  const matches = raw.match(/"([^"]*)"/g);
  if (!matches || matches.length === 0) {
    toast('错误: 未找到有效的 levelData 字符串。请粘贴包含 "..." 的 C++ 代码。');
    return;
  }
  const strings = matches.map(s => s.slice(1, -1)); // 去掉引号
  // 过滤：只保留长度>=100的行（实际地图行），忽略注释行
  const mapRows = strings.filter(s => s.length >= 100);
  if (mapRows.length < 13) {
    toast(`错误: 只找到 ${mapRows.length} 行地图数据 (需要至少13行)。请检查粘贴内容。`);
    return;
  }
  // 取前13行
  const newMap = mapRows.slice(0, 13);
  // 统一列数：取最大列数，不足的用'.'填充
  const maxCols = Math.max(...newMap.map(s => s.length));
  saveUndo();
  mapData = newMap.map(s => s.padEnd(maxCols, '.'));
  // 如果列数变了，更新全局COLS（不允许，保持600）
  if (maxCols !== COLS) {
    // 截断或填充到600
    mapData = mapData.map(s => s.length > COLS ? s.substring(0, COLS) : s.padEnd(COLS, '.'));
    toast(`导入 ${mapData.length} 行 × ${mapData[0].length} 列 (已调整到600列)`);
  } else {
    toast(`成功导入 ${mapData.length} 行 × ${mapData[0].length} 列`);
  }
  renderAll();
  closeModal('importModal');
}

// ============================================================
// 清空
// ============================================================
function clearMap() {
  if (!confirm('确定要清空整个地图吗？此操作可以撤销。')) return;
  saveUndo();
  initDefaultMap();
  renderAll();
  toast('地图已清空，点击撤销可恢复');
}

// ============================================================
// 工具函数
// ============================================================
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2100);
}

// ============================================================
// 视口滚动同步
// ============================================================
viewport.addEventListener('scroll', updateMinimapIndicator);
window.addEventListener('resize', () => {
  updateMinimap();
  updateMinimapIndicator();
});

// ============================================================
// 启动
// ============================================================
updateCanvasSize();
renderAll();
updateMinimap();
updateMinimapIndicator();
selectTile('.');

// 初始滚到起始位置(列17附近，玩家出生点)
setTimeout(() => {
  viewport.scrollLeft = 17 * cellSize - 50;
  updateMinimapIndicator();
}, 100);

console.log('Kirby Level Editor ready. 600x13 grid.');
console.log('左键绘制 | 右键擦除 | 拖拽连续绘制 | Ctrl+Z撤销 | 数字键1-9选方块');
console.log('点击底部小地图快速导航');
</script>
